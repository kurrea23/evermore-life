<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evermore Agent Signup</title>
<meta name="theme-color" content="#0a0f1a">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(900px 500px at 50% 20%,#1a2a4a 0%,#0a0f1a 70%);
  color:#e9eef7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.lockCard{width:min(460px,100%);text-align:center;background:#101a2e;border:1px solid #24365a;
  border-radius:16px;padding:34px 30px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.logoImg{width:280px;max-width:85%;display:block;margin:0 auto 6px}
.sub{color:#d4b576;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;margin-bottom:22px}
input{width:100%;margin-top:10px;padding:13px 14px;border-radius:9px;border:1px solid #2a3a57;
  background:#0e1626;color:#fff;font:inherit;font-size:15px}
input:focus{outline:none;border-color:#d4b576;box-shadow:0 0 0 3px #d4b57622}
button{width:100%;margin-top:16px;border:0;border-radius:10px;padding:13px 16px;
  background:linear-gradient(135deg,#e3c68a,#c5a35e);color:#1d1505;font-weight:800;font:inherit;font-size:15px;cursor:pointer}
.links{margin-top:16px;font-size:13px}.links a{color:#d4b576;text-decoration:none;font-weight:700}
.error{min-height:20px;color:#e0726a;font-size:13px;margin-top:10px}
.fine{color:#8c9cb5;font-size:12.5px;margin-top:18px;line-height:1.55}
</style>
</head>
<body>
<main class="lockCard">
  <img class="logoImg" src="/login/assets/evermore-logo.png" alt="Evermore Life">
  <div class="sub">Create Your Agent Account</div>
  <form id="signupForm">
    <input id="name" name="name" placeholder="Full name" autocomplete="name" required>
    <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="agencyCode" name="agencyCode" autocomplete="off" placeholder="Agency code (optional)">
    <input id="password" name="password" type="password" placeholder="Password (8+ characters)" autocomplete="new-password" required minlength="8">
    <input id="confirm" name="confirm" type="password" placeholder="Confirm password" autocomplete="new-password" required minlength="8">
    <button type="submit">Create Account</button>
    <div class="error" id="error"></div>
  </form>
  <div class="links"><a href="/login/">Already have an account?</a></div>
  <div class="fine">Owner access is assigned by configured owner email in the Worker environment.</div>
</main>
<script src="/agent-suite-auth.js"></script>
<script>
document.getElementById("signupForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const error = document.getElementById("error");
  error.textContent = "";
  const password = document.getElementById("password").value;
  if (password !== document.getElementById("confirm").value) {
    error.textContent = "Passwords do not match.";
    return;
  }
  try {
    const response = await fetch(`${EvermoreAgentSuite.API_BASE}/auth/signup`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password,
        agencyCode: document.getElementById("agencyCode").value,
      }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "Server error.");
    EvermoreAgentSuite.saveSession(data);
    window.location.replace("/score-tracker/");
  } catch (err) {
    error.textContent = err.message || "Server error.";
  }
});
</script>
</body>
</html>

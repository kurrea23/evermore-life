<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evermore Agent Login</title>
<meta name="theme-color" content="#0a0f1a">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(900px 500px at 50% 20%,#1a2a4a 0%,#0a0f1a 70%);
  color:#e9eef7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.lockCard{width:min(420px,100%);text-align:center;background:#101a2e;border:1px solid #24365a;
  border-radius:16px;padding:34px 30px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.logoImg{width:280px;max-width:85%;display:block;margin:0 auto 6px}
.sub{color:#d4b576;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;margin-bottom:22px}
input{width:100%;margin-top:10px;padding:13px 14px;border-radius:9px;border:1px solid #2a3a57;
  background:#0e1626;color:#fff;font:inherit;font-size:15px}
input:focus{outline:none;border-color:#d4b576;box-shadow:0 0 0 3px #d4b57622}
button{width:100%;margin-top:16px;border:0;border-radius:10px;padding:13px 16px;
  background:linear-gradient(135deg,#e3c68a,#c5a35e);color:#1d1505;font-weight:800;font:inherit;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.error{min-height:20px;color:#e0726a;font-size:13px;margin-top:10px}
.linkish{color:#d4b576;font-size:13px;font-weight:700;cursor:pointer;margin-top:14px;text-decoration:none;display:inline-block}
.lockNote{color:#8c9cb5;font-size:12.5px;line-height:1.55;margin-top:18px}
</style>
</head>
<body>
<main class="lockCard">
  <img class="logoImg" src="/login/assets/evermore-logo.png" alt="Evermore Life">
  <div class="sub">Agent Suite</div>
  <form id="loginForm">
    <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Log In</button>
    <div class="error" id="error"></div>
  </form>
  <a class="linkish" href="/signup/">Need an account? Create one</a>
  <p class="lockNote">One login opens Today, General Intake, Inbound Intake, Score Tracker, Pipeline, and Growth Calculator — plus Team when your role allows it.</p>
</main>
<script src="/agent-suite-auth.js"></script>
<script>
const ALLOWED_NEXT = ["/today/", "/intake", "/inbound-client-intake/", "/score-tracker/", "/growth-calculator/", "/clients/", "/team/"];
function nextTarget(){
  const next = new URLSearchParams(location.search).get("next") || "";
  return ALLOWED_NEXT.includes(next) ? next : "/today/";
}
document.getElementById("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const error = document.getElementById("error");
  const btn = document.getElementById("loginBtn");
  error.textContent = "";
  btn.disabled = true; btn.textContent = "Logging in…";
  try {
    const response = await fetch(`${EvermoreAgentSuite.API_BASE}/auth/login`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "Server error.");
    EvermoreAgentSuite.saveSession(data);
    window.location.replace(nextTarget());
  } catch (err) {
    error.textContent = err.message || "Server error.";
    btn.disabled = false; btn.textContent = "Log In";
  }
});
</script>
</body>
</html>

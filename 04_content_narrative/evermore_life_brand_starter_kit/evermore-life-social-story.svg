  <desc id="desc">Vertical story artwork with an invitation to start a protection conversation.</desc>
  <defs><linearGradient id="story" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071726"/><stop offset=".55" stop-color="#0B1F33"/><stop offset="1" stop-color="#1D4B63"/></linearGradient></defs>
  <rect width="1080" height="1920" fill="url(#story)"/>
  <circle cx="540" cy="840" r="330" fill="none" stroke="#C8A96E" stroke-width="4" opacity=".6"/>
